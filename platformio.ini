[env:adv_airmouse]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DESP32S3 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
lib_deps =
 https://github.com/m5stack/M5Cardputer.git#bf64d3178ab43928fa02365fbe3937cec99716ad
 https://github.com/m5stack/M5Unified.git#96576a14247ddc935149145aa6b51943464120f1
 https://github.com/m5stack/M5GFX.git#28d47949bdc84f30881623476f555398e2194313
 arduino-irremote/IRremote@4.7.1
